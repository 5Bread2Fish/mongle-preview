<section class="intro"><div><div class="eyebrow">A LITTLE WINDOW INTO YOUR DAY</div><h1>뭐 해? 대신,<br><em>너의 작은 하루를</em> 내 곁에.</h1></div><p>내가 고른 활동과 짧은 한마디.<br>상대의 화면에는, 그 순간의 작은 캐릭터가 살아요.</p></section>
<main id="root"></main><div id="notifications" role="status" aria-live="polite"></div><div id="overlay"></div>
<script>

 else if(state.screen==='invite')body+=`<h2>내 작은 하루에,<br>너를 초대해.</h2><p class="sub">연인이어도, 친한 친구여도 좋아요.<br>지금은 한 사람과 연결해요.</p>${scene(state.shared||state.draft,false)}<div class="ttl"><label for="relation">우리 사이</label><select id="relation"><option ${state.relation==='연인'?'selected':''}>연인</option><option ${state.relation==='친구'?'selected':''}>친구</option></select></div><div class="ticket"><div class="invite-names">지우가 보내는 작은 초대장</div><strong>MG27JW</strong><p class="helper">이 코드는 작동 시안 전용이에요.</p></div>${state.blocked?'<div class="notice">민준을 차단한 상태예요. 차단 해제 후 새 초대가 필요해요.</div>':state.paired?'<div class="notice">민준과 연결되어 있어요. 한 번에 한 사람만 연결할 수 있어요.</div>':btn('민준의 초대 수락 화면 보기','screen','accept')}<p class="caption">연결 전에는 상대가 내 상태를 볼 수 없어요.</p>${nav('invite')}`;
 else if(state.screen==='accept')body=`<div class="app-top"><b>몽글</b><span class="pill">민준의 화면</span></div><h2>지우가 작은 하루를<br>함께 보고 싶대요.</h2><p class="sub">직접 선택한 활동과 한마디를 나눠요.<br>위치나 대화 상대를 자동으로 추적하지 않아요.</p><div class="scene">${art('rest','soft','cream')}<span class="scene-bottom">꾸민 장면만 담긴 초대장</span></div><div class="notice">연결하면 지우가 공개한 상태를 볼 수 있고,<br>민준도 자신의 상태를 선택해 나눌 수 있어요.</div>${btn('지우와 연결하기 · 시안','accept','','primary',state.blocked)}${btn('아직은 괜찮아요','screen','invite','text-btn')}<p class="caption">실제 가입이나 메시지 발송은 일어나지 않아요.</p>`;
 else if(state.screen==='shop')body+=`<h2>매일 같은 마음도,<br>다른 장면으로.</h2><p class="sub">기본 사용은 무료, 광고는 없어요.<br>마음에 드는 캐릭터와 배경만 소장해요.</p><div class="field-title">내 배경 고르기<small>기본 3종 무료 · 달빛은 팩</small></div><div class="themes">${[['cream','크림','#eadfbe'],['peach','피치','#e9c2ad'],['lavender','라벤더','#d7cce1'],['moon','달빛','#53616b']].map(([t,n,c])=>`<button class="theme ${state.draft.theme===t?'selected':''}" style="--swatch:${c}" data-action="theme" data-value="${t}">${n}${t==='moon'&&!hasPack('sender')?' · 팩':''}</button>`).join('')}</div>${scene({...state.draft,activity:'read',theme:'moon'},false)}<div class="field-title" style="margin-top:0">달빛 서재 팩<small>출시 제안 · 시험 가격</small></div><div class="pack-row"><span>✓</span>12가지 활동 포즈 + 달빛 배경</div><div class="pack-row"><span>✓</span>구매자 소유 · 현재 연결 상대도 사용</div><div class="price"><b>₩9,900</b><span>한 번 구매 · 월 구독 없음</span></div><div class="ttl"><label for="buyer">구매하는 사람</label><select id="buyer"><option value="sender" ${state.buyer==='sender'?'selected':''}>지우 계정</option><option value="receiver" ${state.buyer==='receiver'?'selected':''}>민준 계정</option></select></div>${btn(state.ownedBy[state.buyer]?'내가 소장한 팩':hasPack(state.buyer)?'함께 쓰는 중 · 내 계정에도 소장하기':'구매 후 모습 체험','purchase','',state.ownedBy[state.buyer]?'secondary':'primary')}<p class="helper">구매 기록은 구매자에게 남아요. 연결을 끝내면 상대의 함께 쓰기 혜택은 끝나요.</p>${state.creator.status==='published'?'<div class="notice">작가센터 체험으로 공개한 ‘'+esc(state.creator.title)+'’이 카탈로그에 표시됐어요. 실제 판매는 없어요.</div>':''}${btn('나도 몽글의 작가가 되고 싶어요 ↗','screen','creator','text-btn')}${nav('shop')}`;
 else if(state.screen==='settings')body+=`<h2>가까워도,<br>내 하루는 내 것.</h2><p class="sub">내가 보여주고 싶은 만큼만 나눠요.</p><div class="group"><div class="setting"><div>상태 공유<small>${state.paused?'지금은 공유를 쉬고 있어요':'게시한 상태만 상대에게 보여요'}</small></div><button role="switch" aria-label="상태 공유" aria-checked="${!state.paused}" class="toggle ${state.paused?'':'on'}" data-action="pause"></button></div><div class="setting"><div>상대 잠금화면에 문구 표시<small>기본 꺼짐 · 이름과 문구를 함께 가려요</small></div><button role="switch" aria-label="상대 잠금화면에 문구 표시" aria-checked="${state.lockVisible}" class="toggle ${state.lockVisible?'on':''}" data-action="privacy"></button></div></div><div class="notice">활동·기분·문구는 직접 선택해요.<br>생리 날짜, 위치, 연락처, 대화 상대는 자동으로 수집·공유하지 않아요.</div><div class="group"><div class="setting"><div>연결된 사람<small>${state.paired?`민준 · ${state.relation} · 현재 한 사람`:'아직 연결된 사람이 없어요'}</small></div></div><div class="setting"><div>지우가 소장한 팩<small>${state.ownedBy.sender?'달빛 서재 · 내 구매':'아직 구매한 팩이 없어요'}</small></div></div><div class="setting"><div>현재 함께 쓰는 혜택<small>${hasPack('sender')?'달빛 서재 사용 가능':'기본 장면 사용 가능'}</small></div></div></div>${state.paired?btn('민준과 연결 끝내기','disconnect','','secondary danger'):btn('한 사람 초대하기','screen','invite','secondary')}<div class="row">${btn(state.blocked?'민준 차단 해제':'민준 차단','block','','text-btn danger')}${btn('원치 않는 연락 신고','report','','text-btn')}</div>${state.report?'<div class="notice">신고 후 화면을 체험했어요. 실제 접수는 없어요.</div>':''}${btn('작가센터 ↗','screen','creator','text-btn')}<p class="helper">공유를 꺼도 상대의 오프라인 화면은 갱신 전까지 남을 수 있어요. 새로운 반응은 서버에서 거절하도록 설계해요.</p>${nav('settings')}`;

 else body=`<div class="home-surface ${state.surface==='android'?'android':''}"><div class="surface-date">10월 19일 월요일</div><div class="surface-time">9:41</div><div class="surface-caption">${tag}</div><section class="widget ${changed?'updated':''}" aria-label="상대 상태 위젯">${valid?`<div class="widget-body"><div class="widget-art">${art(d.activity,d.mood,d.theme,true)}</div><div class="widget-text"><div class="widget-name">${state.paired?'지우의 작은 하루':'내 위젯 미리보기'}</div><h3>${activity(d.activity)[1]}</h3><div class="widget-note">${esc(d.note||mood(d.mood)[1])}</div><div class="widget-fresh">${state.paired?'마지막 업데이트 · 방금':'게시 후 상대에게 보여요'}<br>${minutes(d.ttl)} 동안 표시</div></div></div><div class="widget-actions">${btn(`<span class="heart">${state.reaction?'♥':'♡'}</span>${state.sending?'보내는 중…':state.reaction?'꼬옥 남겼어':'꼬옥'}`,'hug','',`hug ${state.reaction?'sent':''}`,!state.paired||state.sending)}${btn('앱에서 보기 ↗','open-receiver','','hug')}</div>`:`<div class="widget-blank"><span>☁</span><h3>${state.blocked?'새로운 안부를 기다려요':!state.paired?'함께할 사람을 기다려요':state.paused?'잠시 쉬어가는 중':'새로운 안부를 기다려요'}</h3><p>${state.blocked?'공유된 새 상태가 없어요.':!state.paired?'연결하면 작은 하루가 이곳에 보여요.':state.paused?'상대가 공유를 쉬고 있어요.':'공유된 새 상태가 없어요.'}<br>지금의 상태를 추측하지 않아요.</p></div>`}</section>${state.offline?'<div class="notice error">오프라인 예시 · 마지막으로 받은 화면이에요.</div>':''}${state.reaction?'<div class="notice">꼬옥 요청이 처리된 모습을 보여줘요.<br>실제 전송·상대의 읽음 확인은 없어요.</div>':''}<div class="os-icons">${[['▦','캘린더'],['◉','카메라'],['♫','음악'],['✿','기록']].map(([i,n])=>`<div class="os-icon"><span>${i}</span>${n}</div>`).join('')}</div><div class="mini-card"><span class="mini-sun">✳</span><div><b>답장을 재촉하지 않는 안부</b><p>늘 보고 있지 않아도 괜찮아.<br>작은 마음 하나만 남겨둘게.</p></div></div></div>`;
 const notes={ios:'<b>iOS 17+ 홈 위젯</b> · 버튼과 상태 전환을 지원해요. 캐릭터는 정지 포즈이며 업데이트 때만 짧게 바뀌어요. 상대 위젯의 즉시 갱신은 보장되지 않아요.',lock:'<b>iOS 17+ 잠금 accessory 위젯</b> · 사각 상태 위젯 + 원형 꼬옥 버튼의 단색 시안이에요. 실제 크기는 기기에 맞춰 검증해요. OS 설정이 우선해요. 버튼은 인증 후 실행돼요.',android:'<b>Android 홈 위젯</b> · 버튼과 활동 이미지 교체를 지원해요. 위젯은 정지 포즈로 제공하고, 기기·런처에 따라 모습과 갱신 시점이 달라져요.'};

}
function creator(){const c=state.creator,flow=['draft','submitted','validated','approved','ready','published'],names=['초안','제출','규격 검사','관리자 승인','판매 준비','공개'];return `<section class="portal"><div class="portal-top"><div><div class="eyebrow">MONGLE CREATOR STUDIO · WEB</div><h2>당신의 캐릭터가,<br>누군가의 하루에.</h2><p class="sub">작가용 별도 웹의 흐름을 이 시안 안에서 체험해요.</p></div><span class="badge">작가·관리자 역할 전환 시뮬레이션</span></div><div class="flow">${flow.map((s,i)=>`<span class="${flow.indexOf(c.status)>=i?'done':''}">${i+1}. ${names[i]}</span>`).join('')}</div><div class="portal-grid"><div><h3>01 · 작가가 제출하는 팩</h3><label class="field-title" for="pack-title">팩 이름</label><input class="text-input" id="pack-title" value="${esc(c.title)}" maxlength="30" ${c.status==='draft'?'':'disabled'}><label class="field-title" for="artist">작가 이름</label><input class="text-input" id="artist" value="${esc(c.artist)}" maxlength="24" ${c.status==='draft'?'':'disabled'}><div class="portal-preview">${art('read','soft','moon')}</div><p class="helper">샘플 에셋: 활동 포즈 12개 + 배경 + 단색 잠금 아이콘<br>이 시안은 실제 파일을 업로드하거나 보관하지 않아요.</p><div class="setting" style="padding-left:0"><label for="rights">내 작품의 배포 권리를 확인했어요.<small>기존 캐릭터·폰트·음원 등 제3자 권리는 별도 확인해요.</small></label><input id="rights" type="checkbox" ${c.rights?'checked':''} ${c.status==='draft'?'':'disabled'}></div>${btn('샘플 팩 제출하기','creator-submit','','primary',c.status!=='draft')}<p class="helper">실제 서비스: 초대된 작가만 로그인해 제출해요.</p></div><div><h3>02 · 검사와 승인, 판매 준비</h3><ul class="validation-list"><li>12가지 활동 ID와 필수 파일 <b>${c.valid?'통과 예시':'검사 전'}</b></li><li>가로·세로 크기 / 용량 / 파일 형식 <b>${c.valid?'통과 예시':'검사 전'}</b></li><li>단색 대비 / 안전 영역 <b>${c.valid?'미리보기 확인 예시':'확인 전'}</b></li><li>저작권 / 금지 콘텐츠 / 작가 계약 <b>${flow.indexOf(c.status)>=3?'관리자 확인 예시':'사람 검토 필요'}</b></li><li>스토어 상품 / 가격 / 사용 권리 연결 <b>${flow.indexOf(c.status)>=4?'판매 준비 예시':'별도 설정 필요'}</b></li></ul><div class="stack">${btn('규격 검사 체험','creator-validate','','secondary',c.status!=='submitted')}${btn('관리자 승인 체험','creator-approve','','secondary',c.status!=='validated')}${btn('스토어 상품 연결 체험','creator-ready','','secondary',c.status!=='approved')}${btn('카탈로그에 공개 체험','creator-publish','','primary',c.status!=='ready')}</div><div class="notice"><b>승인 버튼이 곧 판매 시작은 아니에요.</b><br>에셋 승인 후 스토어 상품·가격·권한을 연결하고, 마지막에 공개해요. 실제 결제·수익 배분·정산은 이 시안에 없어요.</div>${c.status==='published'?btn('앱 상점에서 보기','screen','shop','secondary'):''}${btn('앱으로 돌아가기','screen','shop','text-btn')}</div></div></section>`}
function render(){if(state.shared&&Date.now()>=state.shared.expiresAt)state.expired=true;$('#root').innerHTML=`<div class="shell"><aside class="rail"><nav class="rail-nav" aria-label="체험 화면">${[['compose','내 하루 만들기'],['invite','한 사람 초대'],['shop','캐릭터·배경'],['settings','공유 설정'],['creator','작가센터 웹']].map(([s,n],i)=>btn(`<small>0${i+1}</small>${n}`,'screen',s,state.screen===s?'selected':'')).join('')}</nav><div class="rail-copy"><b>말 걸기 전에,<br>작은 하루를 건네는 사이.</b><br><br>활동 · 기분 · 짧은 한마디를 따로 골라요. 새 상태를 보내면 상대의 캐릭터도 달라져요.<div class="chipline"><span>기본 무료</span><span>광고 없음</span><span>내가 선택</span></div><br>위젯은 정지 장면과 짧은 전환.<br>앱 안에서는 작은 움직임도.</div></aside><div class="stage">${state.screen==='creator'?creator():app()+preview()}</div></div>`;}
function toast(msg){clearTimeout(toastTimer);$('#notifications').innerHTML=`<div class="toast">${esc(msg)}</div>`;toastTimer=setTimeout(()=>$('#notifications').textContent='',4500)}
function modal(title,text,action,label){modalFocus=document.activeElement;$('#overlay').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="eyebrow">MONGLE PREVIEW</div><h2 id="dialog-title">${esc(title)}</h2><p>${esc(text)}</p>${btn(label,action)}${btn('돌아가기','close','','secondary')}</section></div>`;$('.modal').focus()}
function close(){const target=modalFocus;$('#overlay').textContent='';if(target?.isConnected)target.focus()}
function publish(){if(state.offline){toast('연결되지 않아 게시하지 못했어요. 작성한 내용은 남아 있어요.');return}state.draft.note=cleanNote(state.draft.note);if(state.draft.theme==='moon'&&!hasPack('sender'))state.draft.theme='cream';state.version++;state.shared={...state.draft,version:state.version,publishedAt:Date.now(),expiresAt:Date.now()+state.draft.ttl*60000};state.expired=false;state.paused=false;state.reaction=null;state.sending=false;clearTimeout(reactionTimer);if(!state.paired)state.screen='invite';render();toast(state.paired?'시안의 상대 위젯에 새 상태를 적용했어요. 실제 전송은 없어요.':'상태를 저장했어요. 한 사람을 초대해 보세요. 실제 저장 서버는 없어요.')}
function hug(){if(!available()){toast('새 상태가 있고 연결되어 있을 때 반응할 수 있어요.');return}if(state.surface==='lock'&&state.locked){modal('먼저 기기를 인증해요.','실제 잠금 위젯의 버튼은 기기 인증 뒤 실행돼요. 이 버튼은 인증 상태만 시뮬레이션해요.','unlock-hug','인증 후 꼬옥 체험');return}if(state.offline){toast('연결되지 않아 꼬옥을 보내지 못했어요. 자동 재전송하지 않아요.');return}if(state.sending||state.reaction)return;const source=state,version=state.version,pair=state.pairEpoch;state.sending=true;render();reactionTimer=setTimeout(()=>{if(state!==source)return;state.sending=false;if(!available()||state.offline||state.version!==version||state.pairEpoch!==pair){render();toast('상태나 연결이 바뀌어 보내지 않았어요.');return}state.reaction={type:'hug',version};render();toast('꼬옥 요청 성공 상태를 체험했어요. 실제 메시지·읽음 확인은 없어요.')},700)}
function reset(){clearTimeout(reactionTimer);clearTimeout(toastTimer);state=initial();animVersion=-1;$('#notifications').textContent='';close();render()}
document.addEventListener('input',e=>{if(e.target.id==='note'){if(e.isComposing)return;const start=e.target.selectionStart;const raw=e.target.value;const value=graphemes(raw.replace(/[\p{Cc}\p{Cf}]/gu,c=>c==='\u200d'?c:' ').replace(/\s+/gu,' ')).slice(0,20).join('');state.draft.note=value;if(value!==raw){e.target.value=value;e.target.setSelectionRange(Math.min(start,value.length),Math.min(start,value.length))}$('#note-count').textContent=`${graphemes(value).length} / 20`;const bottom=$('.app .scene-bottom');if(bottom)bottom.textContent=value||'말 없이, 지금의 나';}if(e.target.id==='pack-title')state.creator.title=e.target.value;if(e.target.id==='artist')state.creator.artist=e.target.value;});
document.addEventListener('compositionend',e=>{if(e.target.id==='note')e.target.dispatchEvent(new Event('input',{bubbles:true}));});
document.addEventListener('change',e=>{if(e.target.id==='ttl')state.draft.ttl=Number(e.target.value);if(e.target.id==='relation'){state.relation=e.target.value;render()}if(e.target.id==='buyer'){state.buyer=e.target.value;render()}if(e.target.id==='rights')state.creator.rights=e.target.checked;});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,v=el.dataset.value;if(a==='screen'){state.screen=v;render()}else if(a==='activity'){if(state.draft.activity!==v)state.draft.note='';state.draft.activity=v;state.draft.ttl=activity(v)[3];render()}else if(a==='mood'){state.draft.mood=state.draft.mood===v?null:v;render()}else if(a==='surface'){state.surface=v;render()}else if(a==='theme'){if(v==='moon'&&!hasPack('sender')){toast('달빛은 선택 구매 팩이에요. 아래에서 구매 후 모습을 체험해요.');return}state.draft.theme=v;render()}else if(a==='publish'){if(state.paused)modal('상태 공유를 다시 시작할까요?','지금 작성한 상태가 상대에게 다시 보이게 돼요.','resume-publish','이 상태로 공유 시작');else publish()}else if(a==='resume-publish'){close();publish()}else if(a==='accept'){if(state.blocked){toast('차단한 상대와는 연결할 수 없어요.');return}if(state.paired){toast('이미 한 사람과 연결되어 있어요.');return}if(!state.shared){state.screen='compose';render();toast('먼저 보낼 상태를 저장해 주세요.');return}state.paired=true;state.pairEpoch++;state.screen='compose';render();toast('시안에서 지우와 민준을 연결했어요.')}else if(a==='hug')hug();else if(a==='unlock-hug'){state.locked=false;close();render();hug()}else if(a==='unlock'){state.locked=!state.locked;render()}else if(a==='pause'){if(state.paused){modal('상태 공유를 다시 시작할까요?','지금 작성한 상태로 새로 게시해요.','resume-publish','이 상태로 공유 시작');return}state.paused=true;state.sending=false;state.reaction=null;clearTimeout(reactionTimer);render()}else if(a==='privacy'){state.lockVisible=!state.lockVisible;render()}else if(a==='offline'){state.offline=!state.offline;render();toast(state.offline?'오프라인 예시를 켰어요. 새 게시와 반응을 보내지 못해요.':'연결된 예시로 돌아왔어요.')}else if(a==='expire'){if(state.shared){state.expired=true;state.shared.expiresAt=Date.now()-1;state.reaction=null;render()}else toast('게시한 상태가 있어야 만료 모습을 볼 수 있어요.')}else if(a==='disconnect'){modal('민준과의 연결을 끝낼까요?','새 상태·반응과 상대 팩의 공유 혜택이 끝나요. 직접 구매한 팩은 구매자에게 남아요.','confirm-disconnect','시안에서 연결 끝내기')}else if(a==='confirm-disconnect'){state.paired=false;state.pairEpoch++;state.shared=null;state.reaction=null;state.sending=false;state.paused=false;state.expired=false;clearTimeout(reactionTimer);if(!state.ownedBy.sender&&state.draft.theme==='moon')state.draft.theme='cream';close();render();toast('연결을 끝낸 상태예요. 구매자 소유 기록은 남아 있어요.')}else if(a==='block'){modal(state.blocked?'민준의 차단을 해제할까요?':'민준을 차단할까요?',state.blocked?'차단 해제만으로 연결이 복구되지 않아요. 다시 연결하려면 새 초대가 필요해요.':'현재 연결을 끝내고 새 초대와 반응을 막아요. 상대에게 차단 사유를 표시하지 않아요.','confirm-block',state.blocked?'차단 해제 체험':'차단 체험')}else if(a==='confirm-block'){state.blocked=!state.blocked;state.paired=false;state.pairEpoch++;state.shared=null;state.sending=false;state.reaction=null;state.paused=false;state.expired=false;clearTimeout(reactionTimer);if(!state.ownedBy.sender&&state.draft.theme==='moon')state.draft.theme='cream';close();render()}else if(a==='report'){state.reportDraft={target:'민준',reason:'원치 않는 연락',reaction:state.reaction?.type||null,pairEpoch:state.pairEpoch,createdAt:Date.now()};modal('신고 내용을 확인해요.','대상: 민준. 사유: 원치 않는 연락. 포함할 내용: 최근 받은 반응 '+(state.reportDraft.reaction?'꼬옥':'없음')+', 연결 식별값, 신고 시각. 내 비공개 활동·기분·한마디는 보내지 않아요. 시안에서는 실제 접수하지 않아요.','confirm-report','신고 후 모습 체험')}else if(a==='confirm-report'){state.report={...state.reportDraft,simulated:true};state.reportDraft=null;close();render();toast('신고 후 모습을 표시했어요. 실제 접수·검토는 없어요.')}else if(a==='purchase'){if(state.ownedBy[state.buyer]){toast('이 계정이 소장한 팩이에요. 실제 구매 복원은 연결되지 않았어요.');return}modal(`${state.buyer==='sender'?'지우':'민준'} 계정의 구매 체험`,hasPack(state.buyer)?'현재는 상대의 구매 혜택으로 사용 중이에요. 별도로 소장하면 연결이 끝나도 내 계정에 남아요. 시안이므로 실제 결제는 없어요.':'9,900원은 시험 가격이에요. 이 시안은 실제 결제 없이 계정 소유와 현재 상대의 함께 쓰기를 보여줘요.','confirm-purchase','구매 후 모습 적용')}else if(a==='confirm-purchase'){state.ownedBy[state.buyer]=true;if(hasPack('sender'))state.draft.theme='moon';close();render();toast('구매 후 모습을 적용했어요. 실제 결제는 없어요.')}else if(a==='open-receiver'){modal('앱에서 자세히 보는 화면',available()?`지우 · ${activity(state.shared.activity)[1]} · ${state.shared.note||mood(state.shared.mood)[1]}. 앱을 열면 최신 상태를 다시 확인하도록 구현해요.`:'새 상태를 기다리고 있어요. 이전 상태를 현재처럼 보여주지 않아요.','close','확인')}else if(a==='creator-submit'){if(!state.creator.title.trim()||!state.creator.artist.trim()||!state.creator.rights){toast('팩 이름·작가 이름·배포 권리 확인이 필요해요.');return}state.creator.status='submitted';render();toast('샘플 팩을 제출한 단계예요. 실제 업로드는 없어요.')}else if(a==='creator-validate'&&state.creator.status==='submitted'){state.creator.valid=true;state.creator.status='validated';render()}else if(a==='creator-approve'&&state.creator.status==='validated'){state.creator.status='approved';render()}else if(a==='creator-ready'&&state.creator.status==='approved'){state.creator.status='ready';render()}else if(a==='creator-publish'&&state.creator.status==='ready'){state.creator.status='published';render();toast('시안 카탈로그에 표시했어요. 실제 배포·판매는 없어요.')}else if(a==='close')close();else if(a==='reset')reset();});
document.addEventListener('keydown',e=>{const d=$('.modal');if(!d)return;if(e.key==='Escape'){close();return}if(e.key==='Tab'){const all=[...d.querySelectorAll('button,input,[tabindex="0"]')],first=all[0],last=all.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===d)){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// shortcut: this is an in-memory UI prototype; replace simulated transitions with authenticated server and store responses for production.
window.MongleInteractive={getState:()=>structuredClone(state),setScreen:id=>{if(['compose','invite','accept','shop','settings','creator'].includes(id)){state.screen=id;render()}},reset,render,activities:ACTIVITIES.map(x=>x[0]),cleanNote};
render();
